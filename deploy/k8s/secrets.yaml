apiVersion: v1
kind: Secret
metadata:
  name: cdh-bridge-secrets
  namespace: cdh-bridge
type: Opaque
stringData:
  # Replace with real values before applying
  # Base64-encode with: echo -n "value" | base64
  REDIS_URL:              "redis://redis-service:6379"
  KAFKA_BROKERS:          "kafka-service:9092"
  PEGA_CDH_AUTH_TOKEN:    "replace-with-real-token"
  JWT_SECRET:             "replace-with-real-secret"
  PEGA_CDH_URL:           "http://mock-cdh-service:3010"

app       = "cdh-bridge-consent-service"
primary_region = "lhr"

[build]
  image = "ghcr.io/sunilmlodha/cdh-bridge-consent-service:latest"

[env]
  PORT         = "3004"
  NODE_ENV     = "production"
  LOG_LEVEL    = "info"
  MOCK_DATA    = "true"
  PEGA_CDH_URL = "https://cdh-bridge-mock-cdh.fly.dev"

[[services]]
  internal_port = 3004
  protocol      = "tcp"
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port     = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [services.concurrency]
    type       = "connections"
    hard_limit = 200
    soft_limit = 150

  [[services.http_checks]]
    interval    = "15s"
    grace_period = "15s"
    method      = "GET"
    path        = "/health"
    timeout     = "5s"

[resources]
  memory = "256mb"

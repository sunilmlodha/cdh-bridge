name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'dashboard/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:          # allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cdh-bridge

jobs:
  # ── Build and push all service images in parallel ──────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: event-collector
            port: 3001
          - service: profile-router
            port: 3002
          - service: feedback-loop
            port: 3003
          - service: consent-service
            port: 3004
          - service: connector-service
            port: 3005
          - service: mock-cdh
            port: 3010

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max
          platforms: linux/amd64,linux/arm64   # multi-arch for ARM hosts
          build-args: |
            SERVICE_PORT=${{ matrix.port }}
            BUILD_SHA=${{ github.sha }}

  # ── Build Next.js dashboard image ──────────────────────────────────────────
  build-dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-dashboard
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to:   type=gha,scope=dashboard,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Summary job — outputs all image URLs ───────────────────────────────────
  summary:
    name: Deployment summary
    needs: [build-services, build-dashboard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Print image URLs
        run: |
          echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image | Port |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| event-collector  | \`ghcr.io/${{ github.repository_owner }}/cdh-bridge-event-collector:latest\`  | 3001 |" >> $GITHUB_STEP_SUMMARY
          echo "| profile-router   | \`ghcr.io/${{ github.repository_owner }}/cdh-bridge-profile-router:latest\`   | 3002 |" >> $GITHUB_STEP_SUMMARY
          echo "| feedback-loop    | \`ghcr.io/${{ github.repository_owner }}/cdh-bridge-feedback-loop:latest\`    | 3003 |" >> $GITHUB_STEP_SUMMARY
          echo "| consent-service  | \`ghcr.io/${{ github.repository_owner }}/cdh-bridge-consent-service:latest\`  | 3004 |" >> $GITHUB_STEP_SUMMARY
          echo "| connector-service| \`ghcr.io/${{ github.repository_owner }}/cdh-bridge-connector-service:latest\`| 3005 |" >> $GITHUB_STEP_SUMMARY
          echo "| mock-cdh         | \`ghcr.io/${{ github.repository_owner }}/cdh-bridge-mock-cdh:latest\`         | 3010 |" >> $GITHUB_STEP_SUMMARY
          echo "| dashboard        | \`ghcr.io/${{ github.repository_owner }}/cdh-bridge-dashboard:latest\`        | 3000 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy to Railway" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cd deploy/railway && railway up" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
